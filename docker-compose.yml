services:
  postgres_warehouse:
    image: postgres:15-alpine
    container_name: driftops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: driftops_db
    ports:
      - "5432:5432"
    volumes:
      - ./testbed/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driftops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
